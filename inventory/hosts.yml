---
# Example inventory: placeholder host names only. The real inventory lives in AWX
# (or a gitignored local/ copy). Keep the group names; the plays in site.yml key off them.
all:
  vars:
    ans_packages_powershell: present
  children:
    linux:
      hosts:
        app-01.lab.example.com:
    windows:
      hosts:
        win-01.lab.example.com:
      vars:
        ansible_connection: psrp
        ansible_psrp_auth: kerberos
        ansible_psrp_protocol: https
